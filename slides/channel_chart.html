<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PREFIRE channels · slide chart</title>
  <!-- 16:9 slide figure. Rebuild the PNG with: ./slides/render.sh -->
  <style>
    html, body { margin: 0; background: #fff; }
    svg { display: block; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <svg id="chart" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>

  <script src="../player/model.js"></script>
  <script>
    const INK = { primary: "#0b0b0b", secondary: "#52514e", muted: "#898781", grid: "#e1e0d9", axis: "#c3c2b7", surface: "#ffffff" };

    // validated light categorical slots 1–6, assigned in band order
    const GROUPS = [
      { short: "Sun", name: "Sunlight", ch: [1, 3], color: "#2a78d6",
        sees: "Sunlight bouncing off clouds, ice and ground. Daytime only." },
      { short: "SWIR", name: "Short-wave IR", ch: [4, 6], color: "#eb6834",
        sees: "Heat from hot surfaces, plus some sunlight. Picks out hot spots." },
      { short: "H₂O", name: "Water vapour", ch: [7, 9], color: "#1baf7a",
        sees: "Water vapour blocks the ground, so it sees mid-level air (cold)." },
      { short: "Window", name: "Atmospheric window", ch: [10, 15], color: "#eda100",
        sees: "Air is nearly clear, so it sees the ground or the tops of clouds." },
      { short: "CO₂", name: "CO₂ band", ch: [16, 20], color: "#e87ba4",
        sees: "CO₂ blocks the ground, so it sees the cold upper atmosphere." },
      { short: "Far-infrared", name: "Far-infrared", ch: [21, 63], color: "#008300",
        sees: "Spinning water molecules block humid air; dry polar air lets it see the ground." },
    ];
    const groupOf = (n) => GROUPS.find((g) => n >= g.ch[0] && n <= g.ch[1]);

    // example spectrum: clear tropical ocean at night (no sunlight mixed into the heat channels)
    DEMO_MASKED.clear();
    const L = sceneRadiance({ lat: 5, day: false });
    const BT = L.map((x, c) => brightnessTemp(DEMO_WL[c], x));
    const seaSurface = 222 + 78 * Math.cos((5 * Math.PI) / 180) ** 1.4;
    const wl = (n) => DEMO_WL[n - 1];
    const hz = (n) => Math.round(chorusPitch(wl(n), DEMO_WL));

    const W = 1920, PL = 170, PR = 80;
    const cw = (W - PL - PR) / 63;
    const cx = (n) => PL + (n - 0.5) * cw;
    const yTop = 215, yBot = 500, tMin = 220, tMax = 310;
    const y = (t) => yBot - ((t - tMin) / (tMax - tMin)) * (yBot - yTop);

    const T = (x, yy, str, o = {}) =>
      `<text x="${x}" y="${yy}" font-size="${o.size ?? 20}" fill="${o.fill ?? INK.secondary}" font-weight="${o.weight ?? 400}" text-anchor="${o.anchor ?? "start"}">${str}</text>`;

    let s = "";
    s += T(80, 92, "What each of PREFIRE's 63 infrared channels sees", { size: 46, weight: 700, fill: INK.primary });
    s += T(80, 138, "Each channel is one wavelength of infrared light. Where the air is clear, a channel sees the ground; where gases absorb, it sees colder air higher up.", { size: 23 });

    // ---- temperature panel
    s += T(80, yTop - 22, "Temperature each channel sees · clear tropical ocean (modelled example)", { size: 20, weight: 600, fill: INK.primary });
    for (let t = tMin; t <= tMax; t += 20) {
      s += `<line x1="${PL}" x2="${W - PR}" y1="${y(t)}" y2="${y(t)}" stroke="${INK.grid}"/>`;
      s += T(PL - 14, y(t) + 7, `${t} K`, { size: 18, fill: INK.muted, anchor: "end" });
    }
    s += `<line x1="${PL}" x2="${W - PR}" y1="${y(seaSurface)}" y2="${y(seaSurface)}" stroke="${INK.secondary}" stroke-width="1.5"/>`;
    s += T(W - PR, y(seaSurface) - 10, `sea surface ≈ ${Math.round(seaSurface)} K · below this line = seeing colder air above it`, { size: 18, anchor: "end" });
    s += T(cx(2), y(270), "reflected", { size: 17, fill: INK.muted, anchor: "middle" });
    s += T(cx(2), y(270) + 22, "sunlight,", { size: 17, fill: INK.muted, anchor: "middle" });
    s += T(cx(2), y(270) + 44, "not heat", { size: 17, fill: INK.muted, anchor: "middle" });

    let path = "";
    for (let n = 4; n <= 63; n++) path += `${n === 4 ? "M" : "L"}${cx(n).toFixed(1)},${y(BT[n - 1]).toFixed(1)}`;
    s += `<path d="${path}" fill="none" stroke="${INK.axis}" stroke-width="2" stroke-linejoin="round"/>`;
    for (let n = 4; n <= 63; n++) {
      s += `<circle cx="${cx(n)}" cy="${y(BT[n - 1])}" r="6" fill="${groupOf(n).color}" stroke="${INK.surface}" stroke-width="2"/>`;
    }

    // ---- channel strip, coloured by group (2px surface gap between cells)
    const sTop = 528, sH = 34;
    for (let n = 1; n <= 63; n++) {
      s += `<rect x="${PL + (n - 1) * cw + 1}" y="${sTop}" width="${cw - 2}" height="${sH}" rx="3" fill="${groupOf(n).color}"/>`;
    }
    s += T(PL - 14, sTop + 24, "Channel", { size: 18, fill: INK.muted, anchor: "end" });
    for (const n of [1, 10, 20, 30, 40, 50, 63]) {
      s += T(cx(n), sTop + sH + 26, n, { size: 18, fill: INK.primary, anchor: "middle", weight: 600 });
      s += T(cx(n), sTop + sH + 50, `${wl(n).toFixed(1)} µm`, { size: 17, fill: INK.muted, anchor: "middle" });
    }

    // brackets under each group
    const bY = sTop + sH + 74;
    for (const g of GROUPS) {
      const x0 = PL + (g.ch[0] - 1) * cw + 3, x1 = PL + g.ch[1] * cw - 3;
      s += `<path d="M${x0},${bY - 8}V${bY}H${x1}V${bY - 8}" fill="none" stroke="${INK.axis}" stroke-width="1.5"/>`;
      s += T((x0 + x1) / 2, bY + 24, g.short, { size: 18, fill: INK.primary, anchor: "middle", weight: 600 });
    }

    // ---- table
    const cols = [80, 420, 560, 760, 1640];
    const head = ["Band", "Channels", "Wavelength", "What it sees", "Pitch in player"];
    const tTop = 738, rowH = 47;
    head.forEach((h, i) => (s += T(cols[i], tTop, h, { size: 18, fill: INK.muted, weight: 600 })));
    s += `<line x1="80" x2="${W - PR}" y1="${tTop + 14}" y2="${tTop + 14}" stroke="${INK.axis}"/>`;
    GROUPS.forEach((g, r) => {
      const ry = tTop + 14 + rowH * (r + 1) - 16;
      s += `<rect x="80" y="${ry - 16}" width="18" height="18" rx="4" fill="${g.color}"/>`;
      s += T(110, ry, g.name, { size: 21, fill: INK.primary, weight: 600 });
      s += T(cols[1], ry, `${g.ch[0]}–${g.ch[1]}`, { size: 21, fill: INK.primary });
      s += T(cols[2], ry, `${wl(g.ch[0]).toFixed(1)}–${wl(g.ch[1]).toFixed(1)} µm`, { size: 21, fill: INK.primary });
      s += T(cols[3], ry, g.sees, { size: 21, fill: INK.secondary });
      s += T(cols[4], ry, `${hz(g.ch[1])}–${hz(g.ch[0])} Hz`, { size: 21, fill: INK.secondary });
      s += `<line x1="80" x2="${W - PR}" y1="${ry + 15}" y2="${ry + 15}" stroke="${INK.grid}"/>`;
    });
    s += T(80, 1062, "Wavelengths are approximate (≈0.84 µm per channel). Temperatures are from the player's simplified model, not a real measurement. Data: NASA PREFIRE 1B-RAD.", { size: 16, fill: INK.muted });

    document.getElementById("chart").innerHTML = s;
  </script>
</body>
</html>
